<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Trilingual Master: Persistent Progress</title>
    <style>
        :root { --primary: #1a73e8; --success: #34a853; --danger: #ea4335; --bg: #f0f2f5; }
        body { font-Family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: var(--bg); margin: 0; padding: 10px; -webkit-font-smoothing: antialiased; }
        .panel { width: 100%; max-width: 400px; margin-bottom: 10px; }
        .cat-container { background: white; border-radius: 12px; padding: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .cat-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #555; }
        .progress-bg { background: #eee; height: 6px; border-radius: 3px; overflow: hidden; }
        .progress-fill { background: var(--success); height: 100%; width: 0%; transition: width 0.5s ease; }
        .cat-select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ccc; font-size: 14px; font-weight: bold; background: white; margin-bottom: 5px; }
        .diff-container { display: flex; gap: 5px; margin-bottom: 10px; }
        .btn-ui { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid #ccc; font-size: 11px; font-weight: bold; background: white; cursor: pointer; }
        .btn-ui.active { background: #333; color: white; border-color: #333; }
        .type-toggle { display: flex; gap: 5px; background: #ddd; padding: 3px; border-radius: 12px; margin-bottom: 10px; }
        .mode-container { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
        .mode-btn { padding: 6px 4px; border-radius: 8px; background: white; border: 1px solid #ddd; font-size: 10px; font-weight: bold; flex: 1 1 30%; }
        .mode-btn.active { border-color: var(--primary); background: var(--primary); color: white; }
        .header-stats { display: flex; align-items: center; gap: 20px; margin-bottom: 10px; min-height: 60px; }
        .timer-container { position: relative; width: 50px; height: 50px; }
        .timer-svg { transform: rotate(-90deg); width: 50px; height: 50px; }
        .timer-circle-bg { fill: none; stroke: #eee; stroke-width: 4; }
        .timer-circle-prog { fill: none; stroke: var(--primary); stroke-width: 4; stroke-dasharray: 144.5; stroke-dashoffset: 0; transition: stroke-dashoffset 0.1s linear; stroke-linecap: round; }
        .timer-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 12px; font-weight: bold; }
        .score-box { background: white; padding: 10px 20px; border-radius: 15px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card-container { background: white; padding: 1.5rem; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; width: 90%; max-width: 350px; min-height: 320px; transition: transform 0.3s; position: relative; }
        .type-tag { font-size: 10px; text-transform: uppercase; color: white; letter-spacing: 1px; margin: 0 auto 10px auto; display: inline-block; padding: 2px 10px; border-radius: 8px; font-weight: bold; }
        .word { font-size: 1.6rem; font-weight: 800; color: #222; margin-bottom: 1.5rem; min-height: 4rem; display: flex; align-items: center; justify-content: center; }
        .trivia-grid { display: flex; flex-direction: column; gap: 8px; }
        .choice-btn { padding: 12px; border: 2px solid #f0f0f0; border-radius: 14px; background: white; font-size: 14px; font-weight: 500; cursor: pointer; }
        .choice-btn.correct { background: var(--success) !important; color: white; border-color: var(--success); }
        .choice-btn.wrong { background: var(--danger) !important; color: white; border-color: var(--danger); }
        .btn-action { padding: 15px; border-radius: 14px; border: none; font-weight: bold; width: 100%; cursor: pointer; font-size: 16px; color: white; }
        .stats-footer { margin-top: 1.5rem; font-size: 12px; color: #555; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #eee; padding-top: 12px; width: 100%; }
        .stat-row { display: flex; justify-content: space-around; width: 100%; }
        .rem-box { background: #fffde7; padding: 5px 15px; border-radius: 10px; font-weight: bold; color: #f57f17; border: 1px solid #fff9c4; }
        #dict-section { display: none; width: 90%; max-width: 420px; background: white; border-radius: 15px; padding: 10px; margin: 20px 0; font-size: 10px; height: 300px; overflow-y: scroll; }
        .dict-item { display: grid; grid-template-columns: 0.8fr 1fr 1fr 1fr; padding: 8px 0; border-bottom: 1px solid #eee; text-align: center; align-items: center; }
        .mastered { background: #e6f4ea !important; color: #1e8e3e; font-weight: bold; }
        /* Tags */
        .tag-Travel { background: #2196f3; } .tag-city { background: #009688; } .tag-Shopping { background: #e91e63; }
        .tag-Fashion { background: #9c27b0; } .tag-Family { background: #ff9800; } .tag-Finance { background: #4caf50; }
        .tag-Home { background: #795548; } .tag-colors { background: #f44336; } .tag-Connect { background: #607d8b; }
        .tag-Actions { background: #00bcd4; } .tag-Phrases { background: #673ab7; }
    </style>
</head>
<body>

    <div id="difficulty-ui" class="panel diff-container" style="display:none">
        <button class="btn-ui" id="diff-15" onclick="setDifficulty(15)">EASY</button>
        <button class="btn-ui active" id="diff-10" onclick="setDifficulty(10)">MED</button>
        <button class="btn-ui" id="diff-5" onclick="setDifficulty(5)">HARD</button>
    </div>

    <div class="panel">
        <div class="cat-container">
            <div class="cat-header"><span>Category Progress</span><span id="cat-percent">0%</span></div>
            <div class="progress-bg"><div id="cat-bar" class="progress-fill"></div></div>
        </div>
        <!-- Select with hardcoded "All Categories" -->
        <select id="cat-filter" class="cat-select" onchange="resetDeck()">
            <option value="all">All Categories</option>
        </select>
        <div class="type-toggle">
            <button id="style-flash" class="btn-ui active" onclick="setPlayStyle('flash')">Flashcard</button>
            <button id="style-trivia" class="btn-ui" onclick="setPlayStyle('trivia')">Trivia</button>
        </div>
        <div class="mode-container">
            <button class="mode-btn active" onclick="setLangMode('ru', 'ee', this)">RU → EE</button>
            <button class="mode-btn" onclick="setLangMode('ee', 'ru', this)">EE → RU</button>
            <button class="mode-btn" onclick="setLangMode('ee', 'en', this)">EE → EN</button>
            <button class="mode-btn" onclick="setLangMode('en', 'ee', this)">EN → EE</button>
            <button class="mode-btn" onclick="setLangMode('ru', 'en', this)">RU → EN</button>
            <button class="mode-btn" onclick="setLangMode('en', 'ru', this)">EN → RU</button>
        </div>
    </div>

    <div id="trivia-stats-header" class="header-stats" style="visibility: hidden;">
        <div class="timer-container">
            <svg class="timer-svg"><circle class="timer-circle-bg" cx="25" cy="25" r="23"></circle><circle id="timer-bar" class="timer-circle-prog" cx="25" cy="25" r="23"></circle></svg>
            <div id="timer-num" class="timer-text">10</div>
        </div>
        <div class="score-box">Points: <span id="stat-points">0</span></div>
    </div>

    <div class="card-container" id="main-card">
        <span class="type-tag" id="display-type">---</span>
        <div class="word" id="display-q">Loading...</div>
        <div id="view-flash">
            <div class="flash-ans" id="display-a" style="visibility: hidden;">---</div>
            <button class="btn-action" id="btn-reveal" style="background: var(--primary);" onclick="revealFlash()">Reveal Answer</button>
            <div id="flash-controls" style="display: none; gap: 10px;">
                <button class="btn-action" style="background: var(--success);" onclick="submitAnswer(true)">Correct ✅</button>
                <button class="btn-action" style="background: var(--danger);" onclick="submitAnswer(false)">Mistake ❌</button>
            </div>
        </div>
        <div id="view-trivia" style="display: none;"><div class="trivia-grid" id="trivia-options"></div></div>
        <div class="stats-footer">
            <div class="stat-row"><div class="rem-box">Questions Yet: <span id="stat-total-rem">0</span></div></div>
            <div class="stat-row"><span>In Round: <b id="stat-left">0</b></span><span>✅ <span id="stat-c">0</span></span><span>❌ <span id="stat-m">0</span></span></div>
        </div>
    </div>

    <button class="btn-action" style="background: #5f6368; width: 90%; max-width: 350px; margin-top: 15px;" onclick="toggleDict()">📖 Full Dictionary</button>
    <div id="dict-section">
        <button class="btn-action" style="background: var(--danger); margin-bottom: 10px; font-size: 12px; padding: 8px;" onclick="clearMastery()">Reset All Progress</button>
        <div id="dict-list"></div>
    </div>

        function save() { localStorage.setItem('mastered', JSON.stringify([...mastered])); localStorage.setItem('points', stats.points); }
        function clearMastery() { if(confirm("Reset all progress?")) { mastered.clear(); stats.points = 0; save(); resetDeck(); } }

        function updateProgress() {
            const cat = document.getElementById('cat-filter').value;
            const catWords = uniqueWords.filter(w => cat === 'all' || w.type === cat);
            const masteredInCat = Array.from(mastered).filter(ru => {
                const word = uniqueWords.find(w => w.ru === ru);
                return cat === 'all' || (word && word.type === cat);
            }).length;
            const percent = catWords.length === 0 ? 0 : Math.round((masteredInCat / catWords.length) * 100);
            document.getElementById('cat-percent').innerText = percent + '%';
            document.getElementById('cat-bar').style.width = percent + '%';
        }

        function resetDeck() {
            const cat = document.getElementById('cat-filter').value;
            deck = uniqueWords.filter(w => (cat === 'all' || w.type === cat) && !mastered.has(w.ru));
            nextRound = []; nextWord(); updateProgress();
        }

        function nextWord() {
            if (deck.length === 0) {
                if (nextRound.length > 0) { deck = [...nextRound]; nextRound = []; alert("New Round: Mistakes"); }
                else { alert("Mastered all current words!"); return; }
            }
            currentIdx = Math.floor(Math.random() * deck.length); displayCard(); startTimer();
        }

        function displayCard() {
            const word = deck[currentIdx]; const typeEl = document.getElementById('display-type');
            typeEl.innerText = word.type; typeEl.className = `type-tag tag-${word.type}`;
            document.getElementById('display-q').innerText = word[qLang];
            document.getElementById('view-flash').style.display = (style === 'flash') ? 'block' : 'none';
            document.getElementById('view-trivia').style.display = (style === 'trivia') ? 'block' : 'none';
            if (style === 'flash') { document.getElementById('display-a').innerText = word[aLang]; document.getElementById('display-a').style.visibility = 'hidden'; document.getElementById('btn-reveal').style.display = 'block'; document.getElementById('flash-controls').style.display = 'none'; }
            else generateTrivia(); updateStats(); updateProgress();
        }

        function startTimer() { clearInterval(timerInterval); if (style === 'flash') return; timeLeft = timerMax; timerInterval = setInterval(() => { timeLeft -= 0.1; document.getElementById('timer-num').innerText = Math.ceil(timeLeft); document.getElementById('timer-bar').style.strokeDashoffset = 144.5 * (1 - timeLeft / timerMax); if (timeLeft <= 0) { clearInterval(timerInterval); submitAnswer(false); } }, 100); }

        function generateTrivia() {
            const correct = deck[currentIdx][aLang];
            let decoys = uniqueWords.map(w => w[aLang]).filter(w => w !== correct).sort(() => 0.5 - Math.random()).slice(0, 4);
            const options = [...decoys, correct].sort(() => 0.5 - Math.random());
            const container = document.getElementById('trivia-options'); container.innerHTML = '';
            options.forEach(opt => { const btn = document.createElement('button'); btn.className = 'choice-btn'; btn.innerText = opt; btn.onclick = () => { clearInterval(timerInterval); if (opt === correct) { btn.classList.add('correct'); stats.points += 10; setTimeout(() => submitAnswer(true), 400); } else { btn.classList.add('wrong'); setTimeout(() => submitAnswer(false), 600); } }; container.appendChild(btn); });
        }

        function submitAnswer(isCorrect) { 
            const word = deck[currentIdx]; if (isCorrect) { stats.c++; mastered.add(word.ru); deck.splice(currentIdx, 1); save(); } 
            else { stats.m++; nextRound.push(word); deck.splice(currentIdx, 1); } nextWord(); 
        }

        function revealFlash() { document.getElementById('display-a').style.visibility = 'visible'; document.getElementById('btn-reveal').style.display = 'none'; document.getElementById('flash-controls').style.display = 'flex'; }
        function setDifficulty(v) { timerMax = v; nextWord(); }
        function setPlayStyle(s) { style = s; document.getElementById('difficulty-ui').style.display = (s === 'trivia') ? 'flex' : 'none'; document.getElementById('trivia-stats-header').style.visibility = (s === 'trivia') ? 'visible' : 'hidden'; nextWord(); }
        function setLangMode(q, a, btn) { qLang = q; aLang = a; document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); displayCard(); }
        function updateStats() { document.getElementById('stat-left').innerText = deck.length; document.getElementById('stat-c').innerText = stats.c; document.getElementById('stat-m').innerText = stats.m; document.getElementById('stat-points').innerText = stats.points; document.getElementById('stat-total-rem').innerText = deck.length + nextRound.length; }
        function toggleDict() { const d = document.getElementById('dict-section'); d.style.display = d.style.display === 'block' ? 'none' : 'block'; renderDict(); }
